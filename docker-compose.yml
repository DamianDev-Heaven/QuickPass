version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: quickpass_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: quickpass_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  api:
    build:
      context: .
      dockerfile: src/QuickPass.API/Dockerfile
    container_name: quickpass_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=quickpass_db;User=root;Password=rootpassword;
      - Jwt__SecretKey=SuperSecretKeyThatIsVeryLong123456!!!
      - Jwt__Issuer=QuickPassAPI
      - Jwt__Audience=QuickPassUsers
      - Jwt__ExpirationInMinutes=60
    depends_on:
      - db

volumes:
  mysql_data:
